workflows:
  ios-simulator-test:
    name: iOS Simulator Test
    instance_type: mac_mini_m2
    max_build_duration: 60

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Build web app
        script: npm run build

      - name: Create iOS project
        script: npx cap add ios --packagemanager SPM

      - name: Sync Capacitor
        script: npx cap sync ios

      - name: Build iOS simulator app
        script: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath ios/App/build \
            CODE_SIGNING_ALLOWED=NO

    artifacts:
      - ios/App/build/Build/Products/Debug-iphonesimulator/*.app
      - /tmp/xcodebuild_logs/*.log

  ios-app-store:
    name: iOS App Store Build
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: "Codemagic Brushing App"

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.despia.brushingapp

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Build web app
        script: npm run build

      - name: Create iOS project
        script: npx cap add ios --packagemanager SPM

      - name: Sync Capacitor
        script: npx cap sync ios

      - name: Set up App Store code signing
        script: |
          xcode-project use-profiles \
            --project ios/App/App.xcodeproj \
            --archive-method app-store

      - name: Build signed IPA
        script: |
          cd ios/App
          xcode-project build-ipa \
            --project App.xcodeproj \
            --scheme App \
            --archive-xcargs "CURRENT_PROJECT_VERSION=$BUILD_NUMBER MARKETING_VERSION=1.0"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
